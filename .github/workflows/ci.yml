name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pw-version:
    # 讀出專案鎖定的 Playwright 版本，測試用同版本的官方環境（瀏覽器已內建，不必下載）
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "v=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

  validate:
    name: 驗證 themes.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate-themes.js

  test:
    name: E2E 測試 (Playwright)
    needs: [validate, pw-version]
    runs-on: ubuntu-24.04
    # 在 Playwright 官方環境裡跑：瀏覽器已內建，不受測試機作業系統更新（ubuntu-latest 換 26.04）或下載站卡住影響
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.pw-version.outputs.v }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
