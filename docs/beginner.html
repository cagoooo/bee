<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜂勤耘友配對消消樂 - 初階</title>
    <meta name="description" content="蜂勤耘友配對消消樂初階關卡 — 阿凱老師開發的記憶配對遊戲。">
    <meta name="theme-color" content="#0d6efd">
    <meta property="og:title" content="蜂勤耘友配對消消樂 — 初階">
    <meta property="og:description" content="一起來挑戰初階記憶配對！">
    <meta property="og:image" content="https://cagoooo.github.io/bee/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="蜂勤耘友配對消消樂 — 記憶配對遊戲">
    <meta property="og:url" content="https://cagoooo.github.io/bee/beginner.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_TW">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preload" as="image" href="images/card-back.webp" type="image/webp" fetchpriority="high">
    <link rel="prefetch" as="image" href="images/card1.webp">
    <link rel="prefetch" as="image" href="images/card2.webp">
    <link rel="prefetch" as="image" href="images/card3.webp">
    <link rel="prefetch" as="image" href="images/card4.webp">
    <link rel="prefetch" as="image" href="images/card5.webp">
    <link rel="prefetch" as="image" href="images/card6.webp">
    <link rel="prefetch" as="image" href="images/card7.webp">
    <link rel="prefetch" as="image" href="images/card8.webp">
    <link rel="prefetch" as="image" href="images/card9.webp">
    <link rel="prefetch" as="image" href="images/card10.webp">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
</head>
<body data-level="beginner">
    <div class="container">
        <h1 class="text-center colorful-title">
            <div class="title-line">
                <span class="char1">「蜂」</span>
                <span class="char2">勤</span>
                <span class="char3">「耘」</span>
                <span class="char4">友</span>
            </div>
            <div class="title-line">
                <span class="char5">配</span>
                <span class="char6">對</span>
                <span class="char7">消</span>
                <span class="char8">消</span>
                <span class="char9">樂</span>
            </div>
        </h1>
        <div id="game-container">
            <div id="game-board" class="mb-3"></div>
            <div id="game-stats" class="text-center">
                <div id="score" class="mb-2">配對成功: 0</div>
                <div id="moves" class="mb-2">移動次數: 0</div>
                <div id="timer" class="mb-2">時間: 00:00</div>
                <button id="restart" class="btn btn-primary me-2">重新開始</button>
                <button id="mute-button" class="btn btn-secondary">
                    <i class="fas fa-volume-up" id="mute-icon"></i>
                </button>
                <a href="index.html" class="btn btn-secondary mt-2">返回選擇難度</a>
            </div>
        </div>
    </div>
    <audio id="flipSound" preload="auto">
        <source src="audio/card-flip.mp3" type="audio/mpeg">
    </audio>
    <audio id="matchSound" preload="auto">
        <source src="audio/card-match.mp3" type="audio/mpeg">
    </audio>
    <audio id="mismatchSound" preload="auto">
        <source src="audio/card-mismatch.mp3" type="audio/mpeg">
    </audio>
    <audio id="restartSound" preload="auto">
        <source src="audio/restart.mp3" type="audio/mpeg">
    </audio>
    <audio id="backgroundMusic" loop preload="auto">
        <source src="audio/background-music.mp3" type="audio/mpeg">
    </audio>

    <div id="win-modal" class="win-modal" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
      <div class="win-modal__card">
        <h2 id="win-title">🎉 完成！</h2>
        <p class="win-modal__stats">
          總共移動 <strong id="win-moves">0</strong> 次<br>
          費時 <strong id="win-time">00:00</strong>
        </p>
        <p class="win-modal__best" id="win-best"></p>
        <div class="win-modal__buttons">
          <button id="win-again" class="btn btn-primary">再玩一次</button>
          <a href="index.html" class="btn btn-outline-light">換難度</a>
        </div>
      </div>
    </div>

    <footer class="site-credit">
      Made with <span class="site-credit__heart" aria-label="愛心">❤️</span> by
      <a href="https://www.smes.tyc.edu.tw/modules/tadnews/page.php?ncsn=11&nsn=16#a5"
         target="_blank" rel="noopener noreferrer" class="site-credit__author">阿凱老師</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
    <script type="module" src="js/game.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed:', err));
        });
    }
    </script>
</body>
</html>
