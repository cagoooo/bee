<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記憶配對遊戲</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #game-container {
            text-align: center;
        }
        #game-board {
            display: inline-grid;
            grid-template-columns: repeat(4, 100px);
            gap: 10px;
            background-color: #e0e0e0;
            padding: 10px;
            border-radius: 10px;
        }
        .card {
            width: 100px;
            height: 100px;
            background-color: #2196F3;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .card.flipped {
            transform: rotateY(180deg);
            background-color: white;
            color: black;
        }
        #score, #moves {
            margin-top: 10px;
            font-size: 18px;
        }
        #restart {
            margin-top: 10px;
            padding: 5px 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>記憶配對遊戲</h1>
        <div id="game-board"></div>
        <div id="score">配對成功: 0</div>
        <div id="moves">移動次數: 0</div>
        <button id="restart">重新開始</button>
    </div>
    <script>
        const gameBoard = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');
        const movesDisplay = document.getElementById('moves');
        const restartButton = document.getElementById('restart');
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
        let cards = [];
        let flippedCards = [];
        let score = 0;
        let moves = 0;

        function createBoard() {
            gameBoard.innerHTML = '';
            cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.index = index;
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (flippedCards.length < 2 && !this.classList.contains('flipped')) {
                this.classList.add('flipped');
                this.textContent = cards[this.dataset.index];
                flippedCards.push(this);

                if (flippedCards.length === 2) {
                    moves++;
                    movesDisplay.textContent = `移動次數: ${moves}`;
                    setTimeout(checkMatch, 1000);
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.textContent === card2.textContent) {
                score++;
                scoreDisplay.textContent = `配對成功: ${score}`;
                card1.removeEventListener('click', flipCard);
                card2.removeEventListener('click', flipCard);
                if (score === emojis.length) {
                    alert(`恭喜你完成遊戲！總共移動 ${moves} 次`);
                }
            } else {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                card1.textContent = '';
                card2.textContent = '';
            }
            flippedCards = [];
        }

        function restartGame() {
            score = 0;
            moves = 0;
            scoreDisplay.textContent = '配對成功: 0';
            movesDisplay.textContent = '移動次數: 0';
            createBoard();
        }

        restartButton.addEventListener('click', restartGame);
        createBoard();
    </script>
</body>
</html>
