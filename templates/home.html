<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜂勤耘友配對消消樂 - 選擇難度</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .container {
            padding-top: 5vh; /* Adjust this value as needed */
        }
        
        @media (max-width: 768px) {
            .container {
                padding-top: 3vh; /* Slightly less padding for smaller screens */
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding-top: 2vh; /* Even less padding for very small screens */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center colorful-title">
            <div class="title-line">
                <span class="char1">「蜂」</span>
                <span class="char2">勤</span>
                <span class="char3">「耘」</span>
                <span class="char4">友</span>
            </div>
            <div class="title-line">
                <span class="char5">配</span>
                <span class="char6">對</span>
                <span class="char7">消</span>
                <span class="char8">消</span>
                <span class="char9">樂</span>
            </div>
        </h1>
        <div class="text-center mt-5">
            <h2>選擇難度</h2>
            <div class="mt-4">
                <a href="{{ url_for('beginner_game') }}" class="btn btn-primary btn-lg m-2">初階</a>
                <a href="{{ url_for('medium_game') }}" class="btn btn-primary btn-lg m-2">中階</a>
                <a href="{{ url_for('advanced_game') }}" class="btn btn-primary btn-lg m-2">高階</a>
            </div>
        </div>
        <div class="video-container mt-4 mb-4 position-relative">
            <video width="100%" controls>
                <source src="{{ url_for('static', filename='videos/bees.mp4') }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <button class="play-button">
                <i class="fas fa-play"></i>
            </button>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const video = document.querySelector('video');
        const playButton = document.querySelector('.play-button');

        playButton.addEventListener('click', function() {
            if (video.paused) {
                video.play();
                playButton.style.display = 'none';
            }
        });

        video.addEventListener('play', function() {
            playButton.style.display = 'none';
        });

        video.addEventListener('pause', function() {
            playButton.style.display = 'block';
        });
    });
    </script>
</body>
</html>
