<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜂勤耘友配對消消樂 - 選擇難度</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center colorful-title mb-5">
            <div class="title-line">
                <span class="char1">「蜂」</span>
                <span class="char2">勤</span>
                <span class="char3">「耘」</span>
                <span class="char4">友</span>
            </div>
            <div class="title-line">
                <span class="char5">配</span>
                <span class="char6">對</span>
                <span class="char7">消</span>
                <span class="char8">消</span>
                <span class="char9">樂</span>
            </div>
        </h1>
        <div class="text-center mb-5">
            <h2 class="mb-4">選擇難度</h2>
            <div class="d-flex justify-content-center flex-wrap">
                <a href="{{ url_for('beginner_game') }}" class="btn btn-outline-primary btn-lg m-2 difficulty-btn">
                    <i class="fas fa-seedling me-2"></i>初階
                </a>
                <a href="{{ url_for('medium_game') }}" class="btn btn-outline-primary btn-lg m-2 difficulty-btn">
                    <i class="fas fa-tree me-2"></i>中階
                </a>
                <a href="{{ url_for('advanced_game') }}" class="btn btn-outline-primary btn-lg m-2 difficulty-btn">
                    <i class="fas fa-mountain me-2"></i>高階
                </a>
            </div>
        </div>
        <div class="video-container mb-5">
            <div class="video-wrapper position-relative">
                <video id="gameVideo" width="100%" poster="{{ url_for('static', filename='images/video-thumbnail.jpg') }}">
                    <source src="{{ url_for('static', filename='videos/bees.mp4') }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <button class="play-button" id="playButton">
                    <i class="fas fa-play"></i>
                </button>
            </div>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const video = document.getElementById('gameVideo');
        const playButton = document.getElementById('playButton');

        playButton.addEventListener('click', function() {
            if (video.paused) {
                video.play();
                playButton.style.display = 'none';
            } else {
                video.pause();
                playButton.style.display = 'block';
            }
        });

        video.addEventListener('play', function() {
            playButton.style.display = 'none';
        });

        video.addEventListener('pause', function() {
            playButton.style.display = 'block';
        });

        video.addEventListener('ended', function() {
            playButton.style.display = 'block';
        });
    });
    </script>
</body>
</html>
